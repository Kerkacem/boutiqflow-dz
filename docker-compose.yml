version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mahal_app:${POSTGRES_PASSWORD}@postgres:5432/mahal_production
      SESSION_SECRET: ${SESSION_SECRET}
      CHARGILY_SECRET_KEY: ${CHARGILY_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mahal_internal

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: mahal_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mahal_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahal_app -d mahal_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mahal_internal

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - mahal_internal

networks:
  mahal_internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
